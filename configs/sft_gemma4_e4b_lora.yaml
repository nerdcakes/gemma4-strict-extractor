model_name_or_path: google/gemma-4-E4B-it
dataset: /workspace/data/halo_sft_dataset
conversation_field: prompt
dtype: bfloat16
bf16: true
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_task_type: CAUSAL_LM
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
gradient_checkpointing: true
padding_free: false
packing: true
max_length: 2048
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0002
lr_scheduler_type: cosine
warmup_steps: 0.05
num_train_epochs: 3
train_on_completions_only: true
assistant_message_template: "<|turn>model\n"
attn_implementation: sdpa
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 2
logging_steps: 1
report_to: none
seed: 42
output_dir: /workspace/checkpoints/sft_gemma4_e4b_lora
